
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Renew Rehoboth | Premium Recruitment Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FDFBF7;
            --gold: #C5A059;
            --black: #1a1a1a;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--black);
            -webkit-tap-highlight-color: transparent;
            /* Enable bouncy overscroll effect on mobile */
            overscroll-behavior-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        h1, h2, h3, .serif {
            font-family: 'Playfair Display', serif;
        }

        .gold-accent { color: var(--gold); }
        .bg-cream { background-color: var(--cream); }
        .border-gold { border-color: var(--gold); }
        .bg-gold { background-color: var(--gold); }

        /* Bouncy scrolling for containers */
        .bouncy-scroll {
            overflow-y: auto;
            overscroll-behavior-y: contain;
            -webkit-overflow-scrolling: touch;
        }

        /* Mobile safe area padding */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }

        /* Custom scrollbar for desktop, hidden for mobile */
        @media (max-width: 768px) {
            .no-scrollbar::-webkit-scrollbar { display: none; }
            .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        }

        /* Animation for smooth page transitions */
        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
